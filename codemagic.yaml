# Codemagic CI for the iOS rail.
#
# WHAT THIS BUILDS, AND WHY IT IS NOT THE ANDROID PIPELINE
#
# There are three build targets (vite.config.ts): the web build sells through
# ZainCash and Super Qi, the `native` (Android) build sells NOTHING because Play
# forbids selling outside its own billing, and the `ios` build sells through
# Apple because Apple requires it. They are different artefacts with different
# compliance rules, so they get different pipelines. Nothing here is shared with
# the Android workflow on purpose.
#
# The compliance gate below is the load-bearing step. See CLAUDE.md, "No
# purchase surface in the store build".

workflows:
  # Manual compatibility run. It builds the existing iOS target for the
  # "Designed for iPad" Mac destination; it does not publish a Mac binary.
  ios-mac-qa:
    name: iOS app on Apple silicon Mac - interactive QA
    max_build_duration: 90
    instance_type: mac_mini_m2

    environment:
      groups:
        - revenuecat
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        MAC_QA_HOLD_SECONDS: "1200"
      xcode: latest
      cocoapods: default
      node: v22.11.0

    scripts:
      - name: Check iOS configuration and dependencies
        script: |
          test -n "$VITE_REVENUECAT_IOS_KEY"
          case "$VITE_REVENUECAT_IOS_KEY" in
            appl_*) ;;
            *) echo "Expected an iOS RevenueCat public key (appl_*)."; exit 1 ;;
          esac
          test -f ios/App/App/GoogleService-Info.plist
          npm ci
          npm run test:ios-audit

      - name: Prepare the iOS app and its PDF assets
        script: |
          npm run ios:sync
          npm run check:payment-surface:ios
          test -s ios/App/App/public/index.html
          test -s ios/App/App/public/sw.js
          test -s ios/App/App/public/pdfjs/standard_fonts/LiberationSans-Regular.ttf
          cd ios/App && pod install

      - name: Check the Designed for iPad Mac destination
        script: |
          mkdir -p build/mac-qa
          xcodebuild -showdestinations \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            > build/mac-qa/destinations.txt
          cat build/mac-qa/destinations.txt
          if ! grep -Eq 'variant:Designed for (iPad|\[iPad,iPhone\]|\[iPhone,iPad\])' build/mac-qa/destinations.txt; then
            echo "Xcode did not offer a Designed for iPad Mac destination on this builder."
            exit 1
          fi

      - name: Build the iPad app for Mac compatibility
        script: |
          xcodebuild build \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -destination 'platform=macOS,variant=Designed for iPad' \
            -derivedDataPath build/mac-qa/DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Keep the remote Mac available for interactive QA
        script: |
          case "$MAC_QA_HOLD_SECONDS" in
            ''|*[!0-9]*) echo "MAC_QA_HOLD_SECONDS must be a nonnegative integer."; exit 1 ;;
          esac
          if [ "$MAC_QA_HOLD_SECONDS" -gt 1800 ]; then
            echo "MAC_QA_HOLD_SECONDS must be at most 1800."; exit 1
          fi
          echo "Use this time to connect by VNC and run My Mac (Designed for iPad) in Xcode."
          sleep "$MAC_QA_HOLD_SECONDS"

    artifacts:
      - build/mac-qa/destinations.txt
      - /tmp/xcodebuild_logs/*.log

  # ---------------------------------------------------------------------
  # 1. مسار المحاكي: مخصص لـ App Preview (تمت إضافته)
  # ---------------------------------------------------------------------
  ios-preview:
    name: iOS - App Preview (simulator debug build)
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      groups:
        - revenuecat
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        VITE_ENABLE_VCONSOLE: "true"
      xcode: latest
      cocoapods: default
      node: v22.11.0

    scripts:
      - name: Preflight - the RevenueCat public key must be present
        script: |
          if [ -z "$VITE_REVENUECAT_IOS_KEY" ]; then
            echo "VITE_REVENUECAT_IOS_KEY is not set."
            echo "Add it to the 'revenuecat' environment group in Codemagic."
            exit 1
          fi
          case "$VITE_REVENUECAT_IOS_KEY" in
            appl_*) ;;
            *) echo "VITE_REVENUECAT_IOS_KEY does not start with 'appl_'."
               exit 1 ;;
          esac

      - name: Preflight - GoogleService-Info.plist must be committed
        script: |
          if [ ! -f ios/App/App/GoogleService-Info.plist ]; then
            echo "ios/App/App/GoogleService-Info.plist is missing."
            exit 1
          fi

      - name: Install node dependencies
        script: npm ci

      - name: Check iOS native touch and publishing contracts
        script: npm run test:ios-audit

      - name: Build the web bundle and sync it into the Xcode project
        script: npm run ios:sync

      - name: Verify bundled iOS app and PDF assets
        script: |
          test -s ios/App/App/public/index.html
          test -s ios/App/App/public/sw.js
          test -s ios/App/App/public/pdfjs/standard_fonts/LiberationSans-Regular.ttf
          test -s ios/App/App/public/pdfjs/cmaps/78-EUC-H.bcmap
          find ios/App/App/public/assets -maxdepth 1 -name 'pdfWorkerEntry-*.js' | grep -q .

      - name: Store-compliance gate - no off-Apple purchase surface
        script: npm run check:payment-surface:ios

      - name: Install CocoaPods dependencies
        script: |
          cd ios/App && pod install

      - name: Build for simulator
        script: |
          xcodebuild build \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

    artifacts:
      - build/Build/Products/Debug-iphonesimulator/*.app
      - /tmp/xcodebuild_logs/*.log

  # ---------------------------------------------------------------------
  # 2. مسار النشر: مخصص لـ App Store / TestFlight (كما هو لديك)
  # ---------------------------------------------------------------------
  ios-release:
    name: iOS - App Store / TestFlight
    max_build_duration: 90
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.mohadaraty.app
      groups:
        - revenuecat
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.mohadaraty.app"
      xcode: latest
      cocoapods: default
      node: v22.11.0

    scripts:
      - name: Preflight - reject debug tools in release
        script: |
          if [ "$VITE_DEBUG" = "1" ] || [ "$VITE_ENABLE_VCONSOLE" = "true" ]; then
            echo "Cannot build ios-release with VITE_DEBUG or VITE_ENABLE_VCONSOLE."
            exit 1
          fi

      - name: Preflight - the RevenueCat public key must be present
        script: |
          if [ -z "$VITE_REVENUECAT_IOS_KEY" ]; then
            echo "VITE_REVENUECAT_IOS_KEY is not set."
            echo "Add it to the 'revenuecat' environment group in Codemagic."
            exit 1
          fi
          case "$VITE_REVENUECAT_IOS_KEY" in
            appl_*) ;;
            *) echo "VITE_REVENUECAT_IOS_KEY does not start with 'appl_'."
               echo "That is the shape of an iOS PUBLIC SDK key. A key starting"
               echo "'sk_' is the SECRET key and must never be inlined."
               exit 1 ;;
          esac

      - name: Preflight - GoogleService-Info.plist must be committed
        script: |
          if [ ! -f ios/App/App/GoogleService-Info.plist ]; then
            echo "ios/App/App/GoogleService-Info.plist is missing."
            echo "Download it from the Firebase console (iOS app, bundle"
            echo "com.mohadaraty.app) and commit it."
            exit 1
          fi

      - name: Install node dependencies
        script: npm ci

      - name: Check iOS native touch and publishing contracts
        script: npm run test:ios-audit

      - name: Build the web bundle and sync it into the Xcode project
        script: npm run ios:sync

      - name: Verify bundled iOS app and PDF assets
        script: |
          test -s ios/App/App/public/index.html
          test -s ios/App/App/public/sw.js
          test -s ios/App/App/public/pdfjs/standard_fonts/LiberationSans-Regular.ttf
          test -s ios/App/App/public/pdfjs/cmaps/78-EUC-H.bcmap
          find ios/App/App/public/assets -maxdepth 1 -name 'pdfWorkerEntry-*.js' | grep -q .

      - name: Store-compliance gate - no off-Apple purchase surface
        script: npm run check:payment-surface:ios

      - name: Store-compliance gate - reject debug console in release bundle
        script: |
          if grep -rqi "vconsole" ios/App/App/public/; then
            echo "ERROR: vConsole was found inside ios/App/App/public/! Debug tools must never be bundled into ios-release."
            exit 1
          fi

      - name: Install CocoaPods dependencies
        script: |
          cd ios/App && pod install

      - name: Set a unique build number
        script: |
          if ! [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]] || [ "$BUILD_NUMBER" -le 31 ]; then
            echo "iOS 1.0.3 requires a numeric build number greater than installed build 31."
            exit 1
          fi
          sed -i '' "s/CURRENT_PROJECT_VERSION = .*;/CURRENT_PROJECT_VERSION = $BUILD_NUMBER;/g" \
            ios/App/App.xcodeproj/project.pbxproj
          grep -n "CURRENT_PROJECT_VERSION" ios/App/App.xcodeproj/project.pbxproj

      - name: Fetch the signing profiles
        script: xcode-project use-profiles

      - name: Build the .ipa
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

      - name: Verify App Store archive contains the web and PDF assets
        script: |
          ipa=$(find build/ios/ipa -maxdepth 1 -type f -name '*.ipa' -print -quit)
          test -n "$ipa"
          archive_entries=$(unzip -Z1 "$ipa")
          printf '%s\n' "$archive_entries" | grep -E '^Payload/[^/]+\.app/public/index\.html$' >/dev/null
          printf '%s\n' "$archive_entries" | grep -E '^Payload/[^/]+\.app/public/sw\.js$' >/dev/null
          printf '%s\n' "$archive_entries" | grep -E '^Payload/[^/]+\.app/public/pdfjs/standard_fonts/LiberationSans-Regular\.ttf$' >/dev/null
          printf '%s\n' "$archive_entries" | grep -E '^Payload/[^/]+\.app/public/pdfjs/cmaps/78-EUC-H\.bcmap$' >/dev/null
          printf '%s\n' "$archive_entries" | grep -E '^Payload/[^/]+\.app/public/assets/pdfWorkerEntry-[^/]+\.js$' >/dev/null

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - build/ios/**/*.dSYM
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
